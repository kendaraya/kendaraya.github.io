<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0f141c"/>
  <!-- Outer Sacred Ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="3,3"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <!-- Central Diamond House -->
  <polygon points="50,22 78,50 50,78 22,50" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Diagonal rays -->
  <line x1="22" y1="22" x2="78" y2="78" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="78" y1="22" x2="22" y2="78" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="4.5" fill="#f59e0b"/>
</svg>
